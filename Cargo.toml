[package]
name = "localnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Paired LAN remote desktop for macOS and Windows"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
eframe = { version = "=0.34.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
enigo = { version = "=0.6.1", default-features = false }
getrandom = "0.3"
if-addrs = "0.15"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
xcap = "=0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGWindow"] }

[profile.release]
lto = "thin"
codegen-units = 1
