[package]
name = "localnet"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
description = "One-click private LAN remote desktop for macOS and Windows"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
eframe = { version = "=0.34.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
enigo = { version = "=0.6.1", default-features = false }
getrandom = "0.3"
if-addrs = "0.15"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
rcgen = "0.14"
mdns-sd = "=0.21.6"
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake", "require-simd"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
xcap = "=0.9.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=2.0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }
winit = { version = "=0.30.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGWindow"] }

[profile.release]
lto = "thin"
codegen-units = 1
